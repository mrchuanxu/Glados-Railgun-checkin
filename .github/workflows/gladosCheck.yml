name: auto check

on:
  workflow_dispatch:
  schedule:
    # UTC 04:00-09:45 = 北京时间 12:00-17:45
    - cron: '*/15 4-9 * * *'
    # 北京时间 18:00 的兜底触发
    - cron: '0 10 * * *'

concurrency:
  group: glados-checkin
  cancel-in-progress: false

jobs:
  build:
    name: glados/railgun checkin
    runs-on: ubuntu-latest
      
    permissions:
      contents: read
      actions: write

    strategy:
      matrix:
        python-version: [3.13]

    # 这里加入全局环境变量，强制后续所有第三方 actions 兼容 Node.js 24 运行环境
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: Checkout Code
      uses: actions/checkout@v6

    - name: Restore runtime state
      uses: actions/cache/restore@v4
      with:
        path: .state
        key: glados-state-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          glados-state-

    - name: Check daily random gate
      id: gate
      run: |
        mkdir -p .state
        python schedule_gate.py \
          --event-name "${{ github.event_name }}" \
          --repository "${{ github.repository }}" \
          --state-file ".state/checkin-state.json" \
          --github-output "$GITHUB_OUTPUT"

    - name: Set up Python ${{ matrix.python-version }}
      if: steps.gate.outputs.should_run == 'true'
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    # 安装 python 库
    - name: Install dependencies
      if: steps.gate.outputs.should_run == 'true'
      run: |
        python -m pip install --upgrade pip
        pip install requests
        pip install pypushdeer

    # 执行 签到脚本
    - name: Running checkin
      if: steps.gate.outputs.should_run == 'true'
      run: |
        python checkin.py
      env:
        PUSHDEER_SENDKEY: ${{ secrets.PUSHDEER_SENDKEY }}
        GLADOS_COOKIES: ${{ secrets.GLADOS_COOKIES }}
        GLADOS_EXCHANGE_INTERVAL_DAYS: ${{ secrets.GLADOS_EXCHANGE_INTERVAL_DAYS }}
        GLADOS_VERBOSE: ${{ secrets.GLADOS_VERBOSE }}

    - name: Save runtime state
      if: ${{ always() && steps.gate.outputs.should_run == 'true' }}
      uses: actions/cache/save@v4
      with:
        path: .state
        key: glados-state-${{ github.run_id }}-${{ github.run_attempt }}

    - name: Keep alive
      if: steps.gate.outputs.should_run == 'true'
      uses: liskin/gh-workflow-keepalive@v1 
        
    - name: Delete workflow runs
      if: steps.gate.outputs.should_run == 'true'
      uses: Mattraks/delete-workflow-runs@v2
      with:
        token: ${{ github.token }}
        repository: ${{ github.repository }}
        retain_days: 7
        keep_minimum_runs: 7
        delete_run_by_conclusion_pattern: success
